services:
  geant4-course:
    build:
      context: .
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: geant4-particle-transport-course:11.2.2
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - .:/workspace
    init: true
