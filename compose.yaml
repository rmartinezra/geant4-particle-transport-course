services:
  geant4-course:
    image: ${GEANT4_IMAGE:-rmartinezmaple/geant4-particle-transport-course:11.2.2}
    pull_policy: missing
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - .:/workspace
    init: true
